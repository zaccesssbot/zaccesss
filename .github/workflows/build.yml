name: README build

# runs four times a day at 00:17, 06:17, 12:17 and 18:17 UTC to keep the stats fresh,
# on every push to main and on demand from the Actions tab.
# the :17 minute keeps the run off the congested top of the hour so it is less likely
# to be delayed or dropped.
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [main]
    # the build commits the regenerated SVGs and last-good.json and pushes them with a deploy
    # key which, unlike GITHUB_TOKEN, re-triggers workflows. The generated files are ignored so
    # a build commit cannot start another build and loop. approach.svg itself is
    # excluded from this list since it's the hand-edited source, not generated output -
    # editing it should still trigger a build so its dark/light siblings regenerate.
    paths-ignore:
      - 'profile/profile*.svg'
      - 'profile/last-good.json'
      - 'approach/approach-dark.svg'
      - 'approach/approach-light.svg'
  workflow_dispatch:

# write access lets the job push the regenerated SVG back to the repo.
permissions:
  contents: write

# only one build runs at a time. Overlapping runs regenerate the same SVG and
# would otherwise race each other's push; queueing them avoids that.
concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # check out the repo so the workflow has access to its files.
      # fetch-depth: 0 gives a full clone. Gitea rejects shallow pushes to new repos.
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          # push the SVGs over SSH with a write deploy key so the build bypasses the
          # branch ruleset that requires CI on main. A deploy key only grants push access,
          # it has no bearing on the commit author identity set further down.
          ssh-key: ${{ secrets.BUILD_DEPLOY_KEY }}

      # Python 3.12 runs the SVG generator script.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # cache pip downloads so builds are faster on repeat runs.
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # install everything the generator script needs.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # run the generator. It pulls live GitHub stats, writes profile.svg and records every
      # stat it fetched in profile/last-good.json. A stat the API will not give it after the
      # retries is carried over from that file; if the file has no value for it either the
      # generator exits 1, which fails this step and so skips the commit below (every step
      # here runs under the default bash -e shell and none carries an always() condition).
      # ACCESS_TOKEN lives in: Settings > Secrets and variables > Actions > New repository secret
      # it needs read access to the account and its repositories so it can fetch stats.
      # CONTRIB_TOKEN is a separate classic PAT scoped to read:user only, no repo access at all.
      # GitHub's contributionsCollection withholds private-repo detail (commits, reviews, the
      # calendar) from every API caller without that scope; no fine-grained permission grants
      # it, so this is the one place a classic PAT is unavoidable - held as narrowly as possible.
      - name: Generate the profile SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          USER_NAME: zaccesss
        run: python profile/profile.py

      # derive approach-dark.svg and approach-light.svg from the hand-edited approach.svg.
      # no secrets needed - it's a pure palette split of a checked-in source file.
      - name: Generate the approach SVG variants
        run: python approach/approach.py

      # commit the freshly generated SVGs and last-good.json back to the repo under a separate automation identity.
      # the diff check means a commit only happens when something actually changed.
      # push to GitHub (using the token actions/checkout already configured);
      # mirroring to the other forges is handled server-side by mirror-ops.
      - name: Commit and push the updated SVG
        env:
          SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > ~/.sign_key && chmod 600 ~/.sign_key
            ssh-keygen -y -f ~/.sign_key > ~/.sign_key.pub
            git config --global gpg.format ssh
            git config --global user.signingkey ~/.sign_key.pub
            git config --global commit.gpgsign true
          fi
          # zaccesssbot is a real, separate GitHub account (its own verified email, its own
          # registered copy of this signing key), so these commits land there, not on the owner, and
          # actually show as Verified rather than the unlinked placeholder identity this used.
          git config --global user.email "automation@isaacadjei.me"
          git config --global user.name "zaccesssbot"
          git add profile/profile.svg profile/profile-dark.svg profile/profile-light.svg profile/last-good.json approach/approach-dark.svg approach/approach-light.svg
          if git diff --staged --quiet; then
            echo "SVGs and last-good.json unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update generated SVGs"
          # if the remote moved ahead while we were running, replant only our freshly
          # generated SVGs and last-good.json on top of the new tip and retry. A soft reset would keep this
          # run's older copy of every other file staged and quietly revert whatever landed
          # on main meanwhile, so the SVGs are set aside and the tree is reset hard instead.
          # 'if git push' keeps a failed push from tripping 'set -e' mid-loop.
          svgs="profile/profile.svg profile/profile-dark.svg profile/profile-light.svg profile/last-good.json approach/approach-dark.svg approach/approach-light.svg"
          keep="$(mktemp -d)"
          for f in $svgs; do mkdir -p "$keep/$(dirname "$f")"; cp "$f" "$keep/$f"; done
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "Push rejected (attempt ${attempt}); replanting SVGs on latest origin/main..."
            git fetch origin main
            git reset --hard origin/main
            for f in $svgs; do cp "$keep/$f" "$f"; done
            git add $svgs
            if git diff --staged --quiet; then
              echo "Remote already matches our SVGs; nothing to push."
              pushed=true
              break
            fi
            git commit -m "chore: update generated SVGs"
          done
          if [ "$pushed" != true ]; then
            echo "::error::Failed to push updated SVGs after 5 attempts."
            exit 1
          fi
          # mirroring to GitLab, Codeberg, Bitbucket and Gitea is handled
          # server-side by the mirror-ops setup, so no mirror pushes happen here.
