# scan this repository for hard-coded secrets and credentials on every PR targeting
# main and every push. The build only uses a read only token, but a
# tripwire still fails loudly if any credential ever gets committed by mistake. It
# installs a pinned gitleaks binary directly rather than the action wrapper, which needs
# a paid licence for SARIF upload on private repos.

name: Gitleaks Scan

on:
  # PRs catch proposed changes and pushes catch direct automation commits plus any
  # branch push that did not come through a PR yet.
  pull_request:
    branches: [main]
  push:

# least privilege, the job only needs to read the repository contents to scan them.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # check out the repository so gitleaks has the files to scan.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # install a pinned gitleaks binary directly. Pinning the version keeps the scan reproducible.
      - name: Install Gitleaks
        # GitHub's release downloads fail now and then with a 504, so the download is retried and
        # written to a file first, which a retry can safely start again.
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 --max-time 120 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      # scan the working tree files for hard-coded credentials. --redact keeps any finding out of
      # the log and --exit-code=1 fails the workflow if anything is found.
      - name: Run Gitleaks
        run: gitleaks detect --no-git --redact --exit-code=1
