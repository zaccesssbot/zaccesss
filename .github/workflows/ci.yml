# lightweight CI so a broken change cannot land. It compiles and import checks the
# generator scripts and runs the generator's tests against a stubbed API. There is no
# build step, they are plain scripts, so this is quick.

name: CI

on:
  # pull requests only. CI does not need to re-run on main after a PR merges (the same
  # commit was already checked on the PR); the SVG commits the build pushes to main
  # are not code changes worth checking.
  pull_request:

# least privilege, the job only reads the repository.
permissions:
  contents: read

jobs:
  script:
    name: Build script (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # check out the repository.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # set up Python 3.12, the same version the build workflow runs on.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # install the dependencies plus pytest so the import check and the tests below are real.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # byte compile each script to catch syntax errors, then import it to catch
      # import and wiring errors. The token is only read inside main() under the
      # __main__ guard, so this import needs no secret.
      - name: Compile and import check
        run: |
          python -m compileall -q profile/profile.py profile/palettes.py approach/approach.py
          python -c "import sys; sys.path.insert(0, 'profile'); import profile"
          python -c "import sys; sys.path.insert(0, 'approach'); import approach"

      # the generator's retry and last good value handling, with requests stubbed so no
      # token and no network are needed.
      - name: Run the generator tests
        run: python -m pytest -q profile/test_profile.py
